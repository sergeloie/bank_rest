databaseChangeLog:
  - changeSet:
      id: '6'
      author: developer
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: card
                columnName: version
      changes:
        - addColumn:
            tableName: card
            columns:
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - createIndex:
            tableName: card
            columns:
              - column:
                  name: person_id
            indexName: idx_card_person_id
        - createIndex:
            tableName: card
            columns:
              - column:
                  name: card_status
            indexName: idx_card_status
        - createIndex:
            tableName: card
            columns:
              - column:
                  name: expiration_date
            indexName: idx_card_expiration_date
