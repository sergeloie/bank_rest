databaseChangeLog:
  - changeSet:
      id: '1'
      author: superadmin (generated)
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - createTable:
            columns:
              - column:
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_person
                  name: id
                  type: UUID
              - column:
                  constraints:
                    nullable: false
                  name: name
                  type: VARCHAR(255)
              - column:
                  constraints:
                    nullable: false
                  name: password
                  type: VARCHAR(255)
              - column:
                  constraints:
                    nullable: false
                  name: role
                  type: VARCHAR(255)
              - column:
                  name: created_date
                  type: timestamp with time zone
              - column:
                  name: last_modified_date
                  type: timestamp with time zone
              - column:
                  name: created_by
                  type: UUID
              - column:
                  name: modified_by
                  type: UUID
              - column:
                  name: password_version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
            tableName: person
        - addUniqueConstraint:
            columnNames: name
            constraintName: UC_PERSON_NAME
            tableName: person

