databaseChangeLog:
  - changeSet:
      id: '5'
      author: developer
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: person
                columnName: created_by
      changes:
        - addColumn:
            tableName: person
            columns:
              - column:
                  name: created_by
                  type: BIGINT
              - column:
                  name: modified_by
                  type: BIGINT
        - addColumn:
            tableName: card
            columns:
              - column:
                  name: created_by
                  type: BIGINT
              - column:
                  name: modified_by
                  type: BIGINT
        - addColumn:
            tableName: card_block_request
            columns:
              - column:
                  name: created_by
                  type: BIGINT
              - column:
                  name: modified_by
                  type: BIGINT
