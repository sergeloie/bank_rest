databaseChangeLog:
  - changeSet:
      id: 004-seed-admin-user
      author: developer
      changes:
        - insert:
            tableName: person
            columns:
              - column:
                  name: id
                  valueComputed: random_uuid()
              - column:
                  name: name
                  value: admin
              - column:
                  name: password
                  value: ${BANK_ADMIN_PASSWORD}
              - column:
                  name: role
                  value: ADMIN
