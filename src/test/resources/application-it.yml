spring:
  datasource:
    url: jdbc:h2:mem:integrationtest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  liquibase:
    enabled: true
    change-log: classpath:db/migration/db.changelog-master.yaml
    parameters:
      BANK_ADMIN_PASSWORD: testadmin

card:
  bin: "400000"
  retry-limit: 100
  encryption:
    secret: "1234567890123456"
  hash:
    secret: "1234567890123456"

jwt:
  secret: "dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBKV1QgdG9rZW4gc2lnbmluZyE="
  access-expiration: 1800000
  refresh-expiration: 604800000
